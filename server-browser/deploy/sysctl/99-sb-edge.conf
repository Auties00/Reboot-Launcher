# Kernel settings for an sb-edge host (see deploy/tuning.md for NIC, IRQ and conntrack setup).

# Socket buffers: MsQuic sizes its UDP buffers up to these limits; bursts of fan-out to
# hundreds of thousands of peers need headroom.
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 4194304
net.core.wmem_default = 4194304
net.core.netdev_max_backlog = 250000
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 4000

# Busy polling trades a little CPU for lower receive latency on the shard cores.
net.core.busy_read = 0
net.core.busy_poll = 0

# Many concurrent client flows: keep the neighbour and port tables comfortable.
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.neigh.default.gc_thresh1 = 8192
net.ipv4.neigh.default.gc_thresh2 = 32768
net.ipv4.neigh.default.gc_thresh3 = 65536

# File handles for 200k+ connections plus epoll and eventfd per shard.
fs.file-max = 4194304
fs.nr_open = 4194304
