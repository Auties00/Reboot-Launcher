# Three-node JetStream cluster for the lifecycle stream (R3) and the soft-update fan-out.
server_name: $NATS_NAME
port: 4222
http_port: 8222

jetstream {
  store_dir: /data/jetstream
  # Lifecycle records are tiny; the dataset is ~40 MB even at 100k entries.
  max_memory_store: 256MB
  max_file_store: 4GB
}

cluster {
  name: sb
  port: 6222
  routes: [
    nats-route://nats-1:6222
    nats-route://nats-2:6222
    nats-route://nats-3:6222
  ]
}

# Soft updates are small and latency-sensitive: keep write deadlines short so a slow edge is
# disconnected (and recovers from JetStream) instead of buffering.
write_deadline: "2s"
max_pending: 64MB
