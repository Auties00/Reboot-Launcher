syntax = "proto3";

package reboot.api.v1;

import "reboot/api/v1/common.proto";
import "reboot/api/v1/options.proto";

// Values match rbsb/1.
enum Region {
  REGION_ALL = 0;
  REGION_AFRICA = 1;
  REGION_ANTARCTICA = 2;
  REGION_ASIA = 3;
  REGION_EUROPE = 4;
  REGION_NORTH_AMERICA = 5;
  REGION_OCEANIA = 6;
  REGION_SOUTH_AMERICA = 7;
}

enum PasswordFilter {
  PASSWORD_FILTER_ANY = 0;
  PASSWORD_FILTER_WITHOUT = 1;
  PASSWORD_FILTER_ONLY = 2;
}

enum ServerSort {
  SERVER_SORT_PLAYERS = 0;
  SERVER_SORT_NEWEST = 1;
  SERVER_SORT_NAME = 2;
}

enum ConnectionState {
  CONNECTION_STATE_IDLE = 0;
  CONNECTION_STATE_CONNECTING = 1;
  CONNECTION_STATE_CONNECTED = 2;
  CONNECTION_STATE_BACKOFF = 3;
  CONNECTION_STATE_DRAINING = 4;
  CONNECTION_STATE_UDP_BLOCKED = 5;
  // This machine reaches no network; retried on the backoff.
  CONNECTION_STATE_OFFLINE = 6;
  // The network works but the server browser does not answer; retried on the backoff.
  CONNECTION_STATE_SERVICE_DOWN = 7;
}

// Text fields come from strangers: sanitized, but render each one in its own isolated element.
message ServerEntry {
  ServerId id = 1;
  string name = 2;
  string author = 3;
  string description = 4;
  string version = 5;
  uint32 bucket = 6;
  uint32 players = 7;
  uint32 max_players = 8;
  Region region = 9;
  bool has_password = 10;
  bool reachable = 11;
  bool online = 12;
  uint64 created_unix_ms = 13;
  // A library build whose version is in the entry's bucket.
  optional BuildId compatible_build = 14;
  // Published by this user; joining it is refused.
  bool own = 15;
}

message ViewSpec {
  // rbsb/1 bucket: 0 is every version, 1 is unparseable versions.
  uint32 bucket = 1;
  PasswordFilter password = 2;
  Region region = 3;
  ServerSort sort = 4;
  // Rows kept live; the engine clamps it to the edge's limit.
  uint32 window = 5;
}

message BrowserOpenViewRequest {
  ViewSpec spec = 1;
}

message BrowserOpenViewResponse {
  uint64 view_id = 1;
}

message BrowserUpdateViewRequest {
  uint64 view_id = 1;
  ViewSpec spec = 2;
}

message BrowserUpdateViewResponse {}

message BrowserCloseViewRequest {
  uint64 view_id = 1;
}

message BrowserCloseViewResponse {}

message BrowserStateRequest {}

message BrowserStateResponse {
  ConnectionState state = 1;
  repeated uint64 open_views = 2;
  optional Diagnostic error = 3;
}

message BrowserResolveRequest {
  ServerId server = 1;
}

message BrowserResolveResponse {
  ServerEntry entry = 1;
  // Unlisted: reachable only by id or link.
  bool hidden = 2;
}

// A free-text search: a one-off page, not a live view.
message BrowserSearchRequest {
  // 1 to 64 bytes once trimmed, matched against name, author and id; a reboot:// link or a bare
  // server id is resolved by id instead.
  string text = 1;
  // One rbsb/1 bucket, 0 for every version: the cursor pages a single bucket.
  uint32 bucket = 2;
  PasswordFilter password = 3;
  Region region = 4;
  ServerSort sort = 5;
  // The previous page's next_cursor; empty for the first page.
  bytes cursor = 6;
  // 0 is the edge's default page size; larger values are clamped to the edge's limit.
  uint32 limit = 7;
}

message BrowserSearchResponse {
  // This user's own servers are left out.
  repeated ServerEntry rows = 1;
  // Empty on the last page.
  bytes next_cursor = 2;
  // The edge's count, which still includes this user's own servers.
  uint32 total = 3;
  // The text was a link or an id; hidden and offline servers answer too.
  bool resolved_by_id = 4;
}

// One rbsb/1 version bucket: every version with the same major and minor.
message VersionBucket {
  // What ViewSpec.bucket and BrowserSearchRequest.bucket take.
  uint32 bucket = 1;
  // The bucket's major and minor; patch is absent.
  GameVersion version = 2;
  // Library builds with a confirmed version in the bucket, the exact version first, then newest.
  repeated BuildId builds = 3;
}

message BrowserBucketsRequest {
  // More versions to map, such as the catalog's; every confirmed library build is mapped anyway.
  repeated GameVersion versions = 1;
}

message BrowserBucketsResponse {
  // One per distinct bucket, newest version first.
  repeated VersionBucket buckets = 1;
}

message BrowserConnectionChanged {
  ConnectionState state = 1;
  optional uint32 retry_in_ms = 2;
  optional Diagnostic error = 3;
}

message ViewSnapshot {
  uint64 view_id = 1;
  uint32 total = 2;
  uint32 offset = 3;
  repeated ServerEntry rows = 4;
  // The edge is unreachable; rows are the last known ones.
  bool stale = 5;
  // The edge refused the view; there are no rows until a retry it accepts.
  optional Diagnostic error = 6;
}

// Replaces the whole window, so a newer delta supersedes an older one.
message ViewDelta {
  uint64 view_id = 1;
  uint32 total = 2;
  uint32 offset = 3;
  repeated ServerEntry rows = 4;
}

// Live server-browser views over rbsb/1.
service Browser {
  option (service_info) = {id: 14};

  rpc OpenView(BrowserOpenViewRequest) returns (BrowserOpenViewResponse) {
    option (method_info) = {id: 1};
  }
  rpc UpdateView(BrowserUpdateViewRequest) returns (BrowserUpdateViewResponse) {
    option (method_info) = {id: 2};
  }
  rpc CloseView(BrowserCloseViewRequest) returns (BrowserCloseViewResponse) {
    option (method_info) = {id: 3};
  }
  rpc State(BrowserStateRequest) returns (BrowserStateResponse) {
    option (method_info) = {id: 4};
  }
  rpc Resolve(BrowserResolveRequest) returns (BrowserResolveResponse) {
    option (method_info) = {
      id: 5
      kind: METHOD_KIND_OPERATION
    };
  }
  // Waits out a short debounce; a newer search from the same connection cancels this one
  // (CANCEL_REASON_SUPERSEDED).
  rpc Search(BrowserSearchRequest) returns (BrowserSearchResponse) {
    option (method_info) = {
      id: 6
      kind: METHOD_KIND_OPERATION
    };
  }
  // The buckets of the library's builds and of the given versions, for a version filter.
  rpc Buckets(BrowserBucketsRequest) returns (BrowserBucketsResponse) {
    option (method_info) = {id: 7};
  }
}
