syntax = "proto3";

package reboot.api.v1;

import "reboot/api/v1/common.proto";
import "reboot/api/v1/options.proto";

enum SecretKind {
  SECRET_KIND_UNSPECIFIED = 0;
  SECRET_KIND_HOST_JOIN_PASSWORD = 1;
  SECRET_KIND_BACKEND_PASSWORD = 2;
  // Kept only until its NeedsJoinPassword request resolves.
  SECRET_KIND_JOIN_PASSWORD = 3;
}

enum SecretStore {
  SECRET_STORE_UNAVAILABLE = 0;
  SECRET_STORE_CREDENTIAL_MANAGER = 1;
  SECRET_STORE_DPAPI_FILE = 2;
  SECRET_STORE_KEYCHAIN = 3;
  SECRET_STORE_LIBSECRET = 4;
  SECRET_STORE_OWNER_ONLY_FILE = 5;
}

message BackendHost {
  // Compared case-insensitively.
  string host = 1;
  // Absent when the backend origin names no port.
  optional uint32 port = 2;
}

// rb_secret_put and rb_secret_reveal take this, encoded, as their target.
message SecretTarget {
  SecretKind kind = 1;
  // The member `kind` names; any other is refused with secrets.invalid_scope.
  oneof scope {
    // HostJoinPassword.
    HostProfileId host_profile = 2;
    // BackendPassword.
    BackendHost backend = 3;
    // JoinPassword: the id of its NeedsJoinPassword request.
    uint64 join_request = 4;
  }
}

message SecretsStateRequest {
  SecretTarget target = 1;
}

message SecretsStateResponse {
  bool present = 1;
  SecretStore store = 2;
}

// Never carries a value.
message SecretStateChanged {
  SecretTarget target = 1;
  bool present = 2;
  SecretStore store = 3;
}

message SecretsClearRequest {
  SecretTarget target = 1;
}

message SecretsClearResponse {}

// Presence of stored secrets; values only travel through rb_secret_put.
service Secrets {
  option (service_info) = {id: 9};

  rpc State(SecretsStateRequest) returns (SecretsStateResponse) {
    option (method_info) = {id: 1};
  }
  rpc Clear(SecretsClearRequest) returns (SecretsClearResponse) {
    option (method_info) = {id: 2};
  }
}
