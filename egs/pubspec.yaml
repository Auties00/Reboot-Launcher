name: egs
description: Epic Game Server - Fortnite Server Management Tool
version: "1.0.0"

publish_to: 'none'

environment:
  sdk: ">=3.0.0 <=3.19.0"

dependencies:
  # The flutter SDK
  flutter:
    sdk: flutter

  # Reboot common module (for DLL management, process control, etc.)
  reboot_common:
    path: ./../common

  # Windows UI 3
  fluent_ui: ^4.9.1
  flutter_acrylic: ^1.1.4
  fluentui_system_icons: ^1.1.258
  system_theme: ^3.1.1

  # Window management
  window_manager: ^0.4.2

  # Cryptographic functions
  bcrypt: ^1.1.3

  # Async helpers
  async: ^2.11.0
  synchronized: ^3.3.0+3

  # State management
  get: ^4.6.6

  # Native utilities
  file_picker: ^8.1.2
  url_launcher: ^6.3.0

  # Storage
  get_storage: ^2.1.1
  path: ^1.9.0

  # Translations
  intl: any

  # Package info
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
